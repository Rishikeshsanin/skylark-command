name: V2 Observability

on:
  push:
    branches:
      - v2/observability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Copilot evaluation
        run: npm run eval:copilot
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
