name: Agent 5 Release QA

on:
  push:
    branches:
      - agent-5-release-qa-v2

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit and release regression tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Release gate summary
        if: always()
        shell: bash
        run: |
          echo "tests=${{ steps.tests.outcome }}"
          echo "lint=${{ steps.lint.outcome }}"
          echo "build=${{ steps.build.outcome }}"

          failed=0
          if [ "${{ steps.tests.outcome }}" != "success" ]; then failed=1; fi
          if [ "${{ steps.lint.outcome }}" != "success" ]; then failed=1; fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then failed=1; fi

          if [ "$failed" -ne 0 ]; then
            echo "Release QA gate is BLOCKED. See the individual steps above."
            exit 1
          fi

          echo "Release QA gate passed."
