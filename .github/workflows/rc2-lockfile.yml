name: RC2 Lockfile Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm lockfile remains unchanged
        run: git diff --exit-code -- package-lock.json
