name: V2 Change Intelligence

on:
  push:
    branches:
      - v2/change-intelligence
  pull_request:
    branches:
      - v2
      - v2/data-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-change-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
